<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光回線診断ツール Ver4</title>
<style>
body{font-family:Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f4f6f9;margin:0;padding:20px;color:#222;}
.container{max-width:820px;margin:auto;background:#fff;padding:30px;border-radius:16px;box-shadow:0 0 15px rgba(0,0,0,.1);}
h1{text-align:center;margin-bottom:8px;}
.lead{text-align:center;color:#555;margin-bottom:25px;}
label{display:block;margin-top:15px;font-weight:bold;}
select,input{width:100%;padding:12px;margin-top:6px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;font-size:15px;}
button{width:100%;padding:15px;margin-top:24px;background:#0070f3;color:#fff;border:none;border-radius:10px;font-size:16px;cursor:pointer;font-weight:bold;}
button:hover{background:#0059c9;}
.result{display:none;margin-top:30px;background:#f8f9fa;padding:22px;border-radius:12px;}
.card{background:#fff;padding:16px;border-radius:12px;margin:14px 0;border-left:5px solid #0070f3;box-shadow:0 2px 8px rgba(0,0,0,.04);}
.card h2{margin:4px 0;}
.price{font-weight:bold;color:#111;}
.reason{color:#444;line-height:1.7;}
.note{font-size:14px;color:#555;line-height:1.7;}
.warning{background:#fff8e1;border-left:5px solid #ffc107;padding:12px;border-radius:8px;margin-top:12px;color:#5f4b00;}
.line-btn{background:#06c755;}
.line-btn:hover{background:#05a648;}
.small{font-size:13px;color:#666;line-height:1.6;}
</style>
</head>
<body>

<div class="container">
<h1>光回線診断ツール</h1>
<p class="lead">現在のスマホ会社・利用中回線・住居タイプから、提案しやすい光回線を診断します。</p>

<label>住居タイプ</label>
<select id="house">
<option>戸建て</option>
<option>マンション</option>
</select>

<label>お住まい地域</label>
<select id="region">
<option>東日本</option>
<option>西日本</option>
</select>

<label>スマホ会社</label>
<select id="carrier">
<option>docomo</option>
<option>au</option>
<option>SoftBank</option>
<option>楽天モバイル</option>
<option>その他</option>
</select>

<label>現在利用中の回線</label>
<select id="currentLine">
<option>ドコモ光 1G</option>
<option>ドコモ光 10G</option>
<option>SB光</option>
<option>au光</option>
<option>NURO光</option>
<option>ソネット光</option>
<option>ニフティ光</option>
<option>ビックローブ光</option>
<option>ホームルーター</option>
<option>わからない</option>
<option>その他</option>
</select>

<label>月額料金</label>
<select id="fee">
<option>4000円未満</option>
<option>4000～5000円</option>
<option>5000～6000円</option>
<option>6000円以上</option>
<option>わからない</option>
</select>

<label>利用目的</label>
<select id="usage">
<option>動画視聴</option>
<option>オンラインゲーム</option>
<option>在宅ワーク</option>
<option>家族利用</option>
<option>普通に使えればOK</option>
</select>

<label>一番の悩み</label>
<select id="problem">
<option>料金</option>
<option>速度</option>
<option>安定性</option>
<option>サポート</option>
<option>どれを選べばいいかわからない</option>
</select>

<label>郵便番号</label>
<input type="text" id="zipcode" placeholder="123-4567">

<button onclick="diagnose()">診断する</button>

<div id="result" class="result"></div>
</div>

<script>
function price(name, house, region){
  const prices = {
    "ドコモ光 1G": house==="マンション" ? "月額4,400円" : "月額5,720円",
    "ドコモ光 10G": "月額6,380円",
    "SB光 1G": house==="マンション" ? "月額4,180円" : "月額5,720円",
    "SB光 10G": "月額6,270円",
    "ニフティ光 1G": house==="マンション" ? "月額4,268円" : "月額5,478円",
    "ニフティ光 10G": "月額6,380円",
    "ソネット光 1G": house==="マンション" ? "月額4,895円" : "月額5,995円",
    "ソネット光 10G": "月額6,270円",
    "ビックローブ光": "料金確認が必要",
    "au光": "戸建て 月額5,610円",
    "NURO光 2G": region==="東日本" ? "戸建て 月額5,750円" : "戸建て 月額5,530円",
    "NURO光 10G": region==="東日本" ? "戸建て 月額6,250円" : "戸建て 月額6,030円"
  };
  return prices[name] || "料金確認が必要";
}

function addPlan(list, name, reason, house, region){
  if(!list.find(p => p.name === name)){
    list.push({name, reason, price: price(name, house, region)});
  }
}

function removeNgPlans(plans, house, currentLine){
  let filtered = plans;

  // クライアント指示：NURO〜ソネット、ソネット〜NUROは獲得NG
  if(currentLine === "NURO光"){
    filtered = filtered.filter(p => !p.name.includes("ソネット光"));
  }
  if(currentLine === "ソネット光"){
    filtered = filtered.filter(p => !p.name.includes("NURO光"));
  }

  // クライアント指示：マンションはau光・NURO光が提供不可の可能性が高いため上位除外
  if(house === "マンション"){
    filtered = filtered.filter(p => !p.name.includes("au光") && !p.name.includes("NURO光"));
  }

  return filtered;
}

function diagnose(){
  const house = document.getElementById("house").value;
  const region = document.getElementById("region").value;
  const carrier = document.getElementById("carrier").value;
  const currentLine = document.getElementById("currentLine").value;
  const fee = document.getElementById("fee").value;
  const usage = document.getElementById("usage").value;
  const problem = document.getElementById("problem").value;
  const zipcode = document.getElementById("zipcode").value;

  let plans = [];
  let ruleTitle = "おすすめ回線";
  let caution = "";

  // auスマホ・au系回線ルール
  if(carrier === "au" && currentLine === "au光"){
    ruleTitle = "auスマホ・au光利用中向け";
    addPlan(plans, "ニフティ光 1G", "au光利用中の乗り換え候補として提案しやすい回線です。", house, region);
    addPlan(plans, "ソネット光 1G", "au光利用中の候補として案内可能です。", house, region);
    addPlan(plans, "ビックローブ光", "au系の提携候補として案内可能です。", house, region);
  }
  else if(currentLine === "ニフティ光"){
    ruleTitle = "ニフティ光利用中向け";
    addPlan(plans, "ソネット光 1G", "ニフティ光利用中の乗り換え候補です。", house, region);
    addPlan(plans, "au光", "戸建ての場合の候補です。提供可否確認が必要です。", house, region);
    addPlan(plans, "ビックローブ光", "ニフティ光利用中の別候補として案内可能です。", house, region);
  }
  else if(currentLine === "ソネット光"){
    ruleTitle = "ソネット光利用中向け";
    addPlan(plans, "ニフティ光 1G", "ソネット光利用中の乗り換え候補として提案しやすい回線です。", house, region);
    addPlan(plans, "ビックローブ光", "ソネット光利用中の別候補として案内可能です。", house, region);
    addPlan(plans, "au光", "戸建ての場合の候補です。提供可否確認が必要です。", house, region);
  }
  else if(currentLine === "ビックローブ光"){
    ruleTitle = "ビックローブ光利用中向け";
    addPlan(plans, "ニフティ光 1G", "ビックローブ光利用中の乗り換え候補として提案しやすい回線です。", house, region);
    addPlan(plans, "ソネット光 1G", "ビックローブ光利用中の別候補として案内可能です。", house, region);
    addPlan(plans, "au光", "戸建ての場合の候補です。提供可否確認が必要です。", house, region);
  }
  else if(currentLine === "au光"){
    ruleTitle = "au光利用中向け";
    addPlan(plans, "ニフティ光 1G", "au光利用中の乗り換え候補として提案しやすい回線です。", house, region);
    addPlan(plans, "ソネット光 1G", "au光利用中の別候補として案内可能です。", house, region);
    addPlan(plans, "ビックローブ光", "au光利用中の別候補として案内可能です。", house, region);
  }

  // ドコモ系ルール
  else if(carrier === "docomo" && currentLine === "ドコモ光 1G"){
    ruleTitle = "ドコモスマホ・ドコモ光1G利用中向け";
    addPlan(plans, "ドコモ光 10G", "同回線の10Gアップグレード候補です。", house, region);
    if(house === "戸建て"){
      addPlan(plans, "NURO光 2G", "速度重視の別候補として案内可能です。", house, region);
      addPlan(plans, "NURO光 10G", "高速回線を希望する方向けの候補です。", house, region);
    }
    addPlan(plans, "ニフティ光 1G", "料金重視の場合の別候補です。", house, region);
  }
  else if(carrier === "docomo"){
    ruleTitle = "ドコモスマホ利用中向け";
    addPlan(plans, "ドコモ光 1G", "ドコモスマホ利用者に提案しやすい回線です。", house, region);
    addPlan(plans, "ドコモ光 10G", "高速回線を希望する方向けです。", house, region);
    if(house === "戸建て"){
      addPlan(plans, "NURO光 2G", "速度重視の別候補として案内可能です。", house, region);
    }
  }

  // SoftBank系ルール
  else if(carrier === "SoftBank" && currentLine === "SB光"){
    ruleTitle = "SoftBankスマホ・SB光利用中向け";
    if(house === "戸建て"){
      addPlan(plans, "NURO光 2G", "SB光利用中の乗り換え候補として案内可能です。", house, region);
      addPlan(plans, "NURO光 10G", "速度重視の方におすすめです。", house, region);
    }
    addPlan(plans, "ニフティ光 1G", "マンションや料金重視の場合の候補です。", house, region);
  }
  else if(carrier === "SoftBank"){
    ruleTitle = "SoftBankスマホ利用中・他社回線向け";
    addPlan(plans, "SB光 1G", "SoftBankスマホ利用者に提案しやすい回線です。", house, region);
    if(house === "戸建て"){
      addPlan(plans, "NURO光 2G", "速度重視の別候補として案内可能です。", house, region);
      addPlan(plans, "NURO光 10G", "高速回線を希望する方向けです。", house, region);
    }
    addPlan(plans, "ニフティ光 1G", "料金重視の場合の別候補です。", house, region);
  }

  // その他・料金/速度重視の補完
  else {
    ruleTitle = "総合おすすめ";
    if(problem === "料金" || fee === "6000円以上"){
      addPlan(plans, "ニフティ光 1G", "割引後料金が安く、料金重視の方におすすめです。", house, region);
      addPlan(plans, "SB光 1G", "マンション料金が安く、候補にしやすい回線です。", house, region);
      addPlan(plans, "ドコモ光 1G", "安定した候補として提案可能です。", house, region);
    } else if(usage === "オンラインゲーム" && house === "戸建て" && currentLine !== "ソネット光"){
      addPlan(plans, "NURO光 10G", "オンラインゲームなど速度重視の方におすすめです。", house, region);
      addPlan(plans, "ドコモ光 10G", "10G回線の候補として案内可能です。", house, region);
      addPlan(plans, "SB光 10G", "10G回線の候補として案内可能です。", house, region);
    } else {
      addPlan(plans, "ニフティ光 1G", "料金・提案しやすさのバランスが良い回線です。", house, region);
      addPlan(plans, "ドコモ光 1G", "幅広く案内しやすい回線です。", house, region);
      addPlan(plans, "SB光 1G", "SoftBank系の候補として案内可能です。", house, region);
    }
  }

  // 追加補完：マンションの場合は必ず提案しやすい回線を確保
  if(house === "マンション"){
    addPlan(plans, "ニフティ光 1G", "マンション向け料金が安く提案しやすい回線です。", house, region);
    addPlan(plans, "SB光 1G", "マンション向け料金が安く候補にしやすい回線です。", house, region);
    addPlan(plans, "ドコモ光 1G", "マンションでも提案しやすい回線です。", house, region);
  }

  plans = removeNgPlans(plans, house, currentLine);

  // 3件未満の場合の補完
  if(plans.length < 3){
    addPlan(plans, "ニフティ光 1G", "補完候補として案内可能です。", house, region);
    addPlan(plans, "ドコモ光 1G", "補完候補として案内可能です。", house, region);
    addPlan(plans, "SB光 1G", "補完候補として案内可能です。", house, region);
    plans = removeNgPlans(plans, house, currentLine);
  }

  const top3 = plans.slice(0,3);

  if(house === "マンション"){
    caution = "マンションの場合、au光・NURO光は建物設備により提供できない可能性が高いため、上位候補から外しています。";
  }

  let html = `<h2>診断結果</h2>
  <p class="note">${ruleTitle}</p>`;

  if(caution){
    html += `<div class="warning">${caution}</div>`;
  }

  html += `<p class="small">郵便番号：${zipcode ? zipcode : "未入力"} / 住居タイプ：${house} / 現在回線：${currentLine}</p>`;

  top3.forEach((p, i) => {
    const medal = i===0 ? "🥇 第1位" : i===1 ? "🥈 第2位" : "🥉 第3位";
    html += `
      <div class="card">
        <h3>${medal}</h3>
        <h2>${p.name}</h2>
        <p class="price">${p.price}</p>
        <p class="reason">${p.reason}</p>
      </div>
    `;
  });

  html += `
    <hr>
    <h3>無料エリア確認</h3>
    <p class="note">正確な提供可否・キャンペーン・建物対応状況は住所確認が必要です。</p>
    <a href="https://lin.ee/OY5RfF4" target="_blank">
      <button class="line-btn">LINEで無料エリア確認する</button>
    </a>
  `;

  document.getElementById("result").style.display="block";
  document.getElementById("result").innerHTML = html;
}
</script>

</body>
</html>
