<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光回線診断ツール</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f9;margin:0;padding:20px;}
.container{max-width:760px;margin:auto;background:#fff;padding:30px;border-radius:16px;box-shadow:0 0 15px rgba(0,0,0,.1);}
h1{text-align:center;color:#222;}
label{display:block;margin-top:15px;font-weight:bold;}
select,input{width:100%;padding:12px;margin-top:6px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;}
button{width:100%;padding:15px;margin-top:24px;background:#0070f3;color:#fff;border:none;border-radius:10px;font-size:16px;cursor:pointer;}
button:hover{background:#0059c9;}
.result{display:none;margin-top:30px;background:#f8f9fa;padding:22px;border-radius:12px;}
.card{background:#fff;padding:15px;border-radius:10px;margin:12px 0;border-left:5px solid #0070f3;}
.note{font-size:14px;color:#555;}
.line-btn{background:#06c755;}
.line-btn:hover{background:#05a648;}
</style>
</head>
<body>

<div class="container">
<h1>光回線診断ツール</h1>

<label>住居タイプ</label>
<select id="house">
<option>戸建て</option>
<option>マンション</option>
</select>

<label>お住まい地域</label>
<select id="region">
<option>東日本</option>
<option>西日本</option>
</select>

<label>スマホ会社</label>
<select id="carrier">
<option>docomo</option>
<option>au</option>
<option>SoftBank</option>
<option>楽天モバイル</option>
<option>その他</option>
</select>

<label>現在利用中の回線</label>
<select id="currentLine">
<option>ドコモ光</option>
<option>SB光</option>
<option>au光</option>
<option>NURO光</option>
<option>ソネット光</option>
<option>ニフティ光</option>
<option>ホームルーター</option>
<option>わからない</option>
</select>

<label>月額料金</label>
<select id="fee">
<option>4000円未満</option>
<option>4000～5000円</option>
<option>5000～6000円</option>
<option>6000円以上</option>
</select>

<label>利用目的</label>
<select id="usage">
<option>動画視聴</option>
<option>オンラインゲーム</option>
<option>在宅ワーク</option>
<option>家族利用</option>
</select>

<label>一番の悩み</label>
<select id="problem">
<option>料金</option>
<option>速度</option>
<option>安定性</option>
<option>サポート</option>
<option>どれを選べばいいかわからない</option>
</select>

<label>郵便番号</label>
<input type="text" id="zipcode" placeholder="123-4567">

<button onclick="diagnose()">診断する</button>

<div id="result" class="result"></div>
</div>

<script>
function price(name, house, region){
  const prices = {
    "ドコモ光 1G": house==="マンション" ? "月額4,400円" : "月額5,720円",
    "ドコモ光 10G": "月額6,380円",
    "SB光 1G": house==="マンション" ? "月額4,180円" : "月額5,720円",
    "SB光 10G": "月額6,270円",
    "ニフティ光 1G": house==="マンション" ? "月額4,268円" : "月額5,478円",
    "ニフティ光 10G": "月額6,380円",
    "ソネット光 1G": house==="マンション" ? "月額4,895円" : "月額5,995円",
    "ソネット光 10G": "月額6,270円",
    "au光": "戸建て 月額5,610円",
    "NURO光 2G": region==="東日本" ? "戸建て 月額5,750円" : "戸建て 月額5,530円",
    "NURO光 10G": region==="東日本" ? "戸建て 月額6,250円" : "戸建て 月額6,030円"
  };
  return prices[name] || "";
}

function addPlan(list, name, reason, house, region){
  if(!list.find(p => p.name === name)){
    list.push({name, reason, price: price(name, house, region)});
  }
}

function diagnose(){
  const house = document.getElementById("house").value;
  const region = document.getElementById("region").value;
  const carrier = document.getElementById("carrier").value;
  const currentLine = document.getElementById("currentLine").value;
  const usage = document.getElementById("usage").value;
  const problem = document.getElementById("problem").value;

  let plans = [];

  if(problem === "料金"){
    addPlan(plans, "ニフティ光 1G", "割引後料金が安く、料金重視の方におすすめです。", house, region);
  }

  if(usage === "オンラインゲーム" && house === "戸建て" && currentLine !== "ソネット光"){
    addPlan(plans, "NURO光 10G", "速度重視・ゲーム利用の方におすすめです。", house, region);
  }

  if(carrier === "docomo"){
    addPlan(plans, "ドコモ光 1G", "ドコモユーザー向けに提案しやすい回線です。", house, region);
    addPlan(plans, "ドコモ光 10G", "高速回線を希望する方におすすめです。", house, region);
  }

  if(carrier === "SoftBank"){
    addPlan(plans, "SB光 1G", "SoftBankユーザー向けに提案しやすい回線です。", house, region);
  }

  if(carrier === "au"){
    addPlan(plans, "ニフティ光 1G", "au光ではなく、獲得しやすい回線を優先しています。", house, region);
    addPlan(plans, "ドコモ光 1G", "同回線営業の候補としておすすめです。", house, region);
  }

  if(house === "マンション"){
    addPlan(plans, "SB光 1G", "マンション向け料金が安く提案しやすい回線です。", house, region);
    addPlan(plans, "ドコモ光 1G", "マンションでも提案しやすい回線です。", house, region);
    addPlan(plans, "ソネット光 1G", "マンション向け候補として提案可能です。", house, region);
  } else {
    if(currentLine !== "ソネット光"){
      addPlan(plans, "NURO光 2G", "戸建てで速度重視の方におすすめです。", house, region);
    }
    addPlan(plans, "SB光 1G", "戸建て向けの候補としておすすめです。", house, region);
    addPlan(plans, "ソネット光 1G", "戸建て向けの候補としておすすめです。", house, region);
  }

  if(currentLine === "NURO光"){
    plans = plans.filter(p => !p.name.includes("ソネット光"));
  }

  if(currentLine === "ソネット光"){
    plans = plans.filter(p => !p.name.includes("NURO光"));
  }

  if(house === "マンション"){
    plans = plans.filter(p => !p.name.includes("au光") && !p.name.includes("NURO光"));
  }

  const top3 = plans.slice(0,3);

  let html = `<h2>診断結果</h2>
  <p class="note">現在の条件から、獲得しやすい回線を優先して表示しています。</p>`;

  top3.forEach((p, i) => {
    const medal = i===0 ? "🥇 第1位" : i===1 ? "🥈 第2位" : "🥉 第3位";
    html += `
      <div class="card">
        <h3>${medal}</h3>
        <h2>${p.name}</h2>
        <p><strong>${p.price}</strong></p>
        <p>${p.reason}</p>
      </div>
    `;
  });

  html += `
    <hr>
    <h3>無料エリア確認</h3>
    <p>正確な提供可否・キャンペーン・建物対応状況は住所確認が必要です。</p>
    <a href="https://lin.ee/OY5RfF4" target="_blank">
      <button class="line-btn">LINEで無料エリア確認する</button>
    </a>
  `;

  document.getElementById("result").style.display="block";
  document.getElementById("result").innerHTML = html;
}
</script>

</body>
</html>
