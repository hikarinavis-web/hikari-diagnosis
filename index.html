<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光回線診断ツール</title>
<style>
:root{--blue:#0878f9;--blue-dark:#005bc4;--green:#06c755;--green-dark:#05a648;--bg:#f3f6fa;--card:#fff;--text:#202124;--muted:#5f6368;--border:#dfe5ec}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);color:var(--text);font-family:Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
.container{width:min(100%,860px);margin:0 auto;padding:30px;background:#fff;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
h1{margin:0 0 8px;text-align:center;font-size:30px}
.lead{margin:0 0 26px;text-align:center;color:var(--muted);line-height:1.7}
.form-group{margin-top:17px}
label{display:block;margin-bottom:7px;font-weight:700}
.required{margin-left:5px;color:#d93025;font-size:12px}
select{width:100%;padding:14px 12px;border:1px solid #cbd3dc;border-radius:10px;background:#fff;font-size:16px}
.diagnose-button{width:100%;margin-top:25px;padding:16px;border:0;border-radius:11px;background:var(--blue);color:#fff;font-size:18px;font-weight:700;cursor:pointer}
.diagnose-button:hover{background:var(--blue-dark)}
.error{display:none;margin-top:14px;padding:12px;border-radius:9px;background:#fce8e6;color:#b3261e;line-height:1.6}
.result{display:none;margin-top:30px;padding:24px;border-radius:15px;background:#f8fafc}
.result-heading{margin:0 0 14px;font-size:23px}
.recommend-card{padding:20px;border:1px solid var(--border);border-radius:15px;background:var(--card);box-shadow:0 4px 14px rgba(0,0,0,.05)}
.recommend-label{display:inline-block;margin-bottom:8px;padding:6px 11px;border-radius:999px;background:#e8f1ff;color:#075ec7;font-weight:700}
.plan-name{margin:4px 0 18px;font-size:28px}
.condition-box,.reason-box{margin-top:18px}
.section-title{margin:0 0 10px;font-size:18px}
.check-list{display:grid;gap:7px;margin:0;padding:0;list-style:none;line-height:1.6}
.plan-image{width:100%;display:block;margin-top:18px;border-radius:12px}
.image-placeholder{display:flex;min-height:260px;margin-top:18px;align-items:center;justify-content:center;border-radius:12px;background:radial-gradient(circle at 78% 24%,rgba(61,150,255,.75),transparent 24%),linear-gradient(135deg,#02060d,#062a63 58%,#09111f);color:#fff;text-align:center;font-size:26px;font-weight:700;line-height:1.6}
.line-button{display:block;width:100%;margin-top:18px;padding:15px;border-radius:10px;background:var(--green);color:#fff;text-align:center;text-decoration:none;font-size:18px;font-weight:700}
.line-button:hover{background:var(--green-dark)}
.line-note{margin-top:14px;text-align:center;line-height:1.75}
.line-note strong{display:block}
.other-section{margin-top:22px;padding-top:21px;border-top:1px dashed #b7c0ca}
.other-toggle{width:100%;padding:14px;border:1px solid var(--blue);border-radius:10px;background:#fff;color:var(--blue);font-size:17px;font-weight:700;cursor:pointer}
.other-subtitle{margin:9px 0 0;text-align:center;color:var(--muted);font-size:14px}
.candidate-panel{display:none;margin-top:18px}
.candidate-title{margin:0 0 11px;font-size:18px}
.candidate-list{display:grid;gap:10px}
.candidate-button{width:100%;padding:13px 14px;border:1px solid #cad2dc;border-radius:10px;background:#fff;color:#222;text-align:left;font-size:16px;font-weight:700;cursor:pointer}
.candidate-button:hover{border-color:var(--blue);color:var(--blue);background:#f5f9ff}
.price-note{margin:16px 0 0;color:var(--muted);font-size:13px;line-height:1.6}
@media(max-width:640px){body{padding:10px}.container{padding:18px}h1{font-size:25px}.result{padding:14px}.recommend-card{padding:15px}.plan-name{font-size:24px}.image-placeholder{min-height:190px;font-size:22px}}
</style>
</head>
<body>
<main class="container">
<h1>光回線診断ツール</h1>
<p class="lead">5つの項目から、条件に近い光回線をご案内します。</p>

<div class="form-group">
<label for="house">① 住居タイプ<span class="required">必須</span></label>
<select id="house">
<option value="">選択してください</option>
<option value="戸建て">戸建て</option>
<option value="マンション">マンション</option>
</select>
</div>

<div class="form-group">
<label for="region">② お住まい地域<span class="required">必須</span></label>
<select id="region">
<option value="">選択してください</option>
<option value="北海道">北海道</option>
<option value="東日本">東日本</option>
<option value="西日本">西日本</option>
</select>
</div>

<div class="form-group">
<label for="carrier">③ スマホ会社<span class="required">必須</span></label>
<select id="carrier">
<option value="">選択してください</option>
<option value="docomo">docomo</option>
<option value="au">au</option>
<option value="SoftBank">SoftBank</option>
<option value="その他格安スマホ">楽天モバイル・格安スマホ・その他</option>
</select>
</div>

<div class="form-group">
<label for="currentLine">④ 現在利用中の回線<span class="required">必須</span></label>
<select id="currentLine">
<option value="">選択してください</option>
<option value="ドコモ光 1G">ドコモ光 1G</option>
<option value="ドコモ光 10G">ドコモ光 10G</option>
<option value="ソフトバンク光">ソフトバンク光</option>
<option value="au光">au光</option>
<option value="NURO光">NURO光</option>
<option value="ソネット光">ソネット光</option>
<option value="ニフティ光">ニフティ光</option>
<option value="ビッグローブ光">ビッグローブ光</option>
<option value="ホームルーター">ホームルーター</option>
<option value="その他・わからない">その他・わからない</option>
</select>
</div>

<div class="form-group">
<label for="problem">⑤ 一番の悩み<span class="required">必須</span></label>
<select id="problem">
<option value="">選択してください</option>
<option value="料金">料金</option>
<option value="速度">速度</option>
<option value="工事">工事</option>
<option value="引っ越し">引っ越し</option>
<option value="新規契約">新規契約</option>
</select>
</div>

<button class="diagnose-button" type="button" onclick="diagnose()">診断する</button>
<div id="error" class="error"></div>

<section id="result" class="result" aria-live="polite">
<h2 class="result-heading">診断結果</h2>
<article class="recommend-card">
<div class="recommend-label">あなたにおすすめ</div>
<h2 id="planName" class="plan-name"></h2>

<div class="condition-box">
<h3 class="section-title">診断条件</h3>
<ul id="conditionList" class="check-list"></ul>
</div>

<div id="imageArea"></div>

<div class="reason-box">
<h3 class="section-title">おすすめ理由</h3>
<ul id="reasonList" class="check-list"></ul>
</div>

<a id="lineButton" class="line-button" href="https://lin.ee/OY5RfF4" target="_blank" rel="noopener noreferrer">
🟩 LINEで無料診断・相談
</a>

<div class="line-note">
<strong>相談無料</strong>
ご相談後にご検討いただけます<br>
✓ 現在の料金と比較できます<br>
✓ 提供エリアを確認できます
</div>

<p id="priceNote" class="price-note"></p>

<div class="other-section">
<button id="otherToggle" class="other-toggle" type="button" onclick="toggleCandidates()">他のおすすめを見る</button>
<p class="other-subtitle">あなたに合う回線も比較できます</p>
<div id="candidatePanel" class="candidate-panel">
<h3 class="candidate-title">他の診断候補</h3>
<div id="candidateList" class="candidate-list"></div>
</div>
</div>
</article>
</section>
</main>

<script>
const LINE_URL="https://lin.ee/OY5RfF4";

const plans={
docomo1g:{name:"ドコモ光 1G",image:"ドコモ光.png",price:house=>house==="マンション"?"マンション 月額4,400円（税込）〜":"戸建て 月額5,720円（税込）〜",reasons:["ドコモセット割対応","IPv6高速通信対応","dポイントが貯まる"]},
docomo10g:{name:"ドコモ光 10G",image:"",price:()=> "月額6,380円（税込）",reasons:["最大10Gbps対応","ドコモセット割対応","大容量通信におすすめ"]},
softbank1g:{name:"ソフトバンク光 1G",image:"ソフトバンク光.png",price:house=>house==="マンション"?"マンション 月額4,180円（税込）〜":"戸建て 月額5,720円（税込）〜",reasons:["SoftBankセット割対応","IPv6高速通信対応","違約金還元制度あり"]},
softbank10g:{name:"ソフトバンク光 10G",image:"",price:()=> "月額6,270円（税込）",reasons:["最大10Gbps対応","SoftBankセット割対応","ゲーム利用におすすめ"]},
nifty1g:{name:"ニフティ光 1G",image:"ニフティ光.png",price:house=>house==="マンション"?"マンション 月額4,378円（税込）〜":"戸建て 月額5,720円（税込）〜",reasons:["au・UQセット割対応","IPv6高速通信対応","月額料金を抑えやすい"]},
nifty10g:{name:"ニフティ光 10G",image:"",price:()=> "月額6,380円（税込）",reasons:["最大10Gbps対応","au・UQセット割対応","大容量通信におすすめ"]},
biglobe:{name:"ビッグローブ光",image:"ビッグローブ光.png",price:house=>house==="マンション"?"マンション 月額4,378円（税込）〜":"戸建て 月額5,478円（税込）〜",reasons:["au・UQセット割対応","IPv6高速通信対応","工事費負担を抑えやすい"]},
au:{name:"auひかり",image:"au光.png",price:house=>house==="マンション"?"マンション 月額4,180円（税込）〜":"戸建て 月額5,610円（税込）〜",reasons:["au・UQセット割対応","独自回線で混雑に強い","高速通信に対応"]},
nuro2g:{name:"NURO光 2G",image:"ニューロ光.png",price:()=> "月額5,500円（税込）",reasons:["高速通信に対応","SoftBank割対応","工事回数を抑えるプラン"]},
nuro10g:{name:"NURO光 10G",image:"ニューロ光.png",price:()=> "月額6,050円（税込）",reasons:["最大10Gbps対応","ゲーム利用におすすめ","大容量通信に強い"]}
};

let diagnosisPlans=[];
let selectedPlanIndex=0;
let diagnosisConditions=[];

function getNormalPlans(carrier,currentLine,house){
if(carrier==="au"){
if(house==="戸建て"){
if(currentLine==="au光")return["nifty1g","biglobe","nuro2g"];
if(currentLine==="ソネット光")return["nifty1g","biglobe","au"];
if(currentLine==="ニフティ光")return["au","biglobe","nuro2g"];
if(currentLine==="ビッグローブ光")return["nifty1g","au","nuro2g"];
return["nifty1g","biglobe","au"];
}
return["nifty1g","biglobe","docomo1g"];
}

if(carrier==="docomo"){
if(currentLine==="ドコモ光 10G")return["nuro2g","nuro10g"];
if(currentLine==="ドコモ光 1G")return["docomo10g","nuro2g","nuro10g"];
return["docomo1g","docomo10g","nuro2g"];
}

if(carrier==="SoftBank"){
if(currentLine==="ソフトバンク光")return["nuro2g","nuro10g"];
if(currentLine==="NURO光")return["softbank1g","softbank10g"];
return["softbank1g","nuro2g","nuro10g"];
}

return["nifty1g","biglobe","nuro2g"];
}

function getSpeedPlans(carrier,currentLine){
if(carrier==="docomo"){
if(currentLine==="ドコモ光 10G")return["nuro10g","nifty10g","softbank10g"];
return["docomo10g","nuro10g","nifty10g"];
}
if(carrier==="SoftBank")return["softbank10g","nuro10g","nifty10g"];
if(carrier==="au")return["nifty10g","nuro10g","docomo10g"];
return["nifty10g","nuro10g","softbank10g"];
}

function getCarrierCondition(carrier){
if(carrier==="docomo")return"docomoスマホ利用";
if(carrier==="au")return"auスマホ利用";
if(carrier==="SoftBank")return"SoftBankスマホ利用";
return"格安スマホ・その他";
}

function validateForm(){
const ids=["house","region","carrier","currentLine","problem"];
const missing=ids.some(id=>!document.getElementById(id).value);
const error=document.getElementById("error");

if(missing){
error.textContent="必須項目をすべて選択してください。";
error.style.display="block";
return false;
}

error.style.display="none";
return true;
}

function diagnose(){
if(!validateForm())return;

const house=document.getElementById("house").value;
const region=document.getElementById("region").value;
const carrier=document.getElementById("carrier").value;
const currentLine=document.getElementById("currentLine").value;
const problem=document.getElementById("problem").value;

diagnosisPlans=problem==="速度"
?getSpeedPlans(carrier,currentLine)
:getNormalPlans(carrier,currentLine,house);

diagnosisConditions=[
getCarrierCondition(carrier),
house,
region,
`現在：${currentLine}`,
`お悩み：${problem}`
];

selectedPlanIndex=0;
renderSelectedPlan();
renderCandidateButtons();

document.getElementById("candidatePanel").style.display="none";
document.getElementById("otherToggle").textContent="他のおすすめを見る";

const result=document.getElementById("result");
result.style.display="block";
result.scrollIntoView({behavior:"smooth",block:"start"});
}

function renderSelectedPlan(){
const planKey=diagnosisPlans[selectedPlanIndex];
const plan=plans[planKey];
const house=document.getElementById("house").value;

document.getElementById("planName").textContent=plan.name;
document.getElementById("conditionList").innerHTML=
diagnosisConditions.map(item=>`<li>✔ ${item}</li>`).join("");

const imageArea=document.getElementById("imageArea");
if(plan.image){
imageArea.innerHTML=`<img class="plan-image" src="${plan.image}" alt="${plan.name}の回線画像">`;
}else{
imageArea.innerHTML=`<div class="image-placeholder">${plan.name}<br>10G専用画像 準備中</div>`;
}

document.getElementById("reasonList").innerHTML=
plan.reasons.slice(0,3).map(reason=>`<li>✓ ${reason}</li>`).join("");

document.getElementById("lineButton").href=LINE_URL;
document.getElementById("priceNote").textContent=
`${plan.price(house)}　※提供条件やキャンペーンにより異なる場合があります。`;
}

function renderCandidateButtons(){
const list=document.getElementById("candidateList");
list.innerHTML="";

diagnosisPlans.forEach((planKey,index)=>{
if(index===selectedPlanIndex)return;
const plan=plans[planKey];
const button=document.createElement("button");
button.type="button";
button.className="candidate-button";
button.textContent=`○ ${plan.name}`;
button.onclick=()=>selectCandidate(index);
list.appendChild(button);
});

if(list.children.length===0){
list.innerHTML=`<p class="note">現在、他の診断候補はありません。</p>`;
}
}

function selectCandidate(index){
selectedPlanIndex=index;
renderSelectedPlan();
renderCandidateButtons();
document.querySelector(".recommend-card").scrollIntoView({behavior:"smooth",block:"start"});
}

function toggleCandidates(){
const panel=document.getElementById("candidatePanel");
const button=document.getElementById("otherToggle");
const opening=panel.style.display!=="block";

panel.style.display=opening?"block":"none";
button.textContent=opening?"他のおすすめを閉じる":"他のおすすめを見る";
}
</script>
</body>
</html>
