<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光回線診断ツール Ver6</title>

<style>
:root{
  --blue:#0878f9;
  --blue-dark:#005bc4;
  --green:#06c755;
  --green-dark:#05a648;
  --bg:#f4f6f9;
  --text:#222;
}

*{box-sizing:border-box;}

body{
  font-family:Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  background:var(--bg);
  margin:0;
  padding:20px;
  color:var(--text);
}

.container{
  max-width:840px;
  margin:auto;
  background:#fff;
  padding:30px;
  border-radius:16px;
  box-shadow:0 0 15px rgba(0,0,0,.1);
}

h1{
  text-align:center;
  margin:0 0 8px;
}

.lead{
  text-align:center;
  color:#555;
  margin:0 0 25px;
  line-height:1.7;
}

label{
  display:block;
  margin-top:16px;
  font-weight:bold;
}

select,input{
  width:100%;
  padding:13px;
  margin-top:6px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:15px;
  background:#fff;
}

.main-button{
  width:100%;
  padding:16px;
  margin-top:25px;
  background:var(--blue);
  color:#fff;
  border:none;
  border-radius:10px;
  font-size:17px;
  cursor:pointer;
  font-weight:bold;
}

.main-button:hover{background:var(--blue-dark);}

.result{
  display:none;
  margin-top:30px;
  background:#f8f9fa;
  padding:22px;
  border-radius:12px;
}

.card{
  background:#fff;
  padding:18px;
  border-radius:13px;
  margin:16px 0;
  border-left:6px solid var(--blue);
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.rank{
  margin:0 0 12px;
  font-size:22px;
}

.plan-name{
  margin:14px 0 6px;
  font-size:25px;
}

.card-image{
  width:100%;
  display:block;
  border-radius:10px;
  margin:0 0 12px;
}

.line-link{
  display:block;
  text-decoration:none;
}

.line-button{
  width:100%;
  padding:14px;
  margin:0 0 14px;
  background:var(--green);
  color:#fff;
  border:none;
  border-radius:9px;
  font-size:17px;
  cursor:pointer;
  font-weight:bold;
}

.line-button:hover{background:var(--green-dark);}

.price{
  font-weight:bold;
  font-size:18px;
  color:#111;
  margin:10px 0;
}

.reason{
  color:#444;
  line-height:1.7;
  margin-bottom:0;
}

.note{
  font-size:14px;
  color:#555;
  line-height:1.7;
}

.warning{
  background:#fff8e1;
  border-left:5px solid #ffc107;
  padding:12px;
  border-radius:8px;
  margin:12px 0;
  color:#5f4b00;
  line-height:1.7;
}

.small{
  font-size:13px;
  color:#666;
  line-height:1.6;
}

@media(max-width:600px){
  body{padding:10px;}
  .container{padding:18px;}
  .result{padding:14px;}
  .card{padding:13px;}
  .rank{font-size:19px;}
  .plan-name{font-size:22px;}
}
</style>
</head>

<body>
<div class="container">

<h1>光回線診断ツール</h1>
<p class="lead">
現在のスマホ会社・利用中回線・利用目的から、案内可能な光回線を診断します。
</p>

<label for="house">住居タイプ</label>
<select id="house">
  <option value="戸建て">戸建て</option>
  <option value="マンション">マンション</option>
</select>

<label for="region">お住まい地域</label>
<select id="region">
  <option value="東日本">東日本</option>
  <option value="西日本">西日本</option>
</select>

<label for="carrier">スマホ会社</label>
<select id="carrier">
  <option value="docomo">docomo</option>
  <option value="au">au</option>
  <option value="SoftBank">SoftBank</option>
  <option value="その他格安スマホ">楽天モバイル・格安スマホ・その他</option>
</select>

<label for="currentLine">現在利用中の回線</label>
<select id="currentLine">
  <option value="ドコモ光 1G">ドコモ光 1G</option>
  <option value="ドコモ光 10G">ドコモ光 10G</option>
  <option value="ソフトバンク光">ソフトバンク光</option>
  <option value="au光">au光</option>
  <option value="NURO光">NURO光</option>
  <option value="ソネット光">ソネット光</option>
  <option value="ニフティ光">ニフティ光</option>
  <option value="ビッグローブ光">ビッグローブ光</option>
  <option value="ホームルーター">ホームルーター</option>
  <option value="その他・わからない">その他・わからない</option>
</select>

<label for="fee">現在の月額料金</label>
<select id="fee">
  <option value="4000円未満">4,000円未満</option>
  <option value="4000～5000円">4,000～5,000円</option>
  <option value="5000～6000円">5,000～6,000円</option>
  <option value="6000円以上">6,000円以上</option>
  <option value="わからない">わからない</option>
</select>

<label for="usage">利用目的</label>
<select id="usage">
  <option value="普通に使う">普通に使う</option>
  <option value="動画視聴・SNS">動画視聴・SNS</option>
  <option value="在宅ワーク">在宅ワーク</option>
  <option value="オンラインゲーム">オンラインゲーム</option>
  <option value="高画質動画・大容量通信">高画質動画・大容量通信</option>
</select>

<label for="problem">一番の悩み</label>
<select id="problem">
  <option value="料金">料金</option>
  <option value="速度">速度</option>
</select>

<label for="zipcode">郵便番号</label>
<input type="text" id="zipcode" inputmode="numeric" placeholder="123-4567">

<button class="main-button" type="button" onclick="diagnose()">診断する</button>

<div id="result" class="result" aria-live="polite"></div>

</div>

<script>
const LINE_URL = "https://lin.ee/OY5RfF4";

/*
  表示料金は、提供された料金情報・画像を基準にしています。
  キャンペーン、契約期間、地域、建物、プロバイダ等により変動する場合があります。
*/
function price(name, house){
  const prices = {
    "ドコモ光 1G": house === "マンション" ? "月額4,400円（税込）〜" : "月額5,720円（税込）〜",
    "ドコモ光 10G": "月額6,380円（税込）",

    "ソフトバンク光 1G": house === "マンション" ? "月額4,180円（税込）〜" : "月額5,720円（税込）〜",
    "ソフトバンク光 10G": "月額6,270円（税込）",

    "ニフティ光 1G": house === "マンション" ? "月額4,378円（税込）〜" : "月額5,720円（税込）〜",
    "ニフティ光 10G": "月額6,380円（税込）",

    "ビッグローブ光": house === "マンション" ? "月額4,378円（税込）〜" : "月額5,478円（税込）〜",

    "au光": house === "マンション" ? "月額4,180円（税込）〜" : "月額5,610円（税込）〜",

    "NURO光 2G": "月額5,500円（税込）",
    "NURO光 10G": "月額6,050円（税込）"
  };

  return prices[name] || "料金はLINEで確認";
}

/*
  現時点では1G・10Gとも同じブランド画像を使用します。
  10G専用画像が完成したら、ここだけ画像ファイル名を変更すれば差し替えできます。
*/
function getImage(name){
  if(name.includes("NURO")) return "ニューロ光.png";
  if(name.includes("ビッグローブ")) return "ビッグローブ光.png";
  if(name.includes("ドコモ")) return "ドコモ光.png";
  if(name.includes("ソフトバンク")) return "ソフトバンク光.png";
  if(name.includes("au光")) return "au光.png";
  if(name.includes("ニフティ")) return "ニフティ光.png";
  return "";
}

function addPlan(list, name, reason, house){
  // ソネット光は現在利用中回線としては残すが、提案先には表示しない
  if(name.includes("ソネット光")) return;

  if(!list.some(plan => plan.name === name)){
    list.push({
      name,
      reason,
      price:price(name, house),
      image:getImage(name)
    });
  }
}

function addSpeedPlans(plans, carrier, currentLine, house){
  if(carrier === "docomo"){
    if(currentLine === "ドコモ光 10G"){
      addPlan(plans, "NURO光 10G", "現在10G利用中のため、別の10G回線候補です。", house);
      addPlan(plans, "ニフティ光 10G", "料金と速度の両方を比較できる10G候補です。", house);
      addPlan(plans, "ソフトバンク光 10G", "高速通信を希望する方向けの10G候補です。", house);
    }else{
      addPlan(plans, "ドコモ光 10G", "ドコモスマホ利用者向けの10G候補です。", house);
      addPlan(plans, "NURO光 10G", "ゲーム・大容量通信向けの10G候補です。", house);
      addPlan(plans, "ニフティ光 10G", "高速通信を希望する方向けの10G候補です。", house);
    }
  }
  else if(carrier === "SoftBank"){
    addPlan(plans, "ソフトバンク光 10G", "SoftBankスマホ利用者向けの10G候補です。", house);
    addPlan(plans, "NURO光 10G", "ゲーム・大容量通信向けの10G候補です。", house);
    addPlan(plans, "ニフティ光 10G", "高速通信を希望する方向けの10G候補です。", house);
  }
  else if(carrier === "au"){
    addPlan(plans, "ニフティ光 10G", "auスマホ利用者に案内しやすい10G候補です。", house);
    addPlan(plans, "NURO光 10G", "ゲーム・大容量通信向けの10G候補です。", house);
    addPlan(plans, "ドコモ光 10G", "比較対象として案内可能な10G候補です。", house);
  }
  else{
    addPlan(plans, "ニフティ光 10G", "格安スマホ利用者向けの10G候補です。", house);
    addPlan(plans, "NURO光 10G", "ゲーム・大容量通信向けの10G候補です。", house);
    addPlan(plans, "ソフトバンク光 10G", "高速通信を希望する方向けの10G候補です。", house);
  }
}

function addAuNormalPlans(plans, house, currentLine){
  if(house === "戸建て"){
    if(currentLine === "au光"){
      addPlan(plans, "ニフティ光 1G", "au光利用中の乗り換え候補です。", house);
      addPlan(plans, "ビッグローブ光", "auスマホ利用者に案内しやすい候補です。", house);
      addPlan(plans, "NURO光 2G", "速度も重視したい方向けの候補です。", house);
    }
    else if(currentLine === "ソネット光"){
      addPlan(plans, "ニフティ光 1G", "ソネット光利用中の乗り換え候補です。", house);
      addPlan(plans, "ビッグローブ光", "auスマホ利用者に案内しやすい候補です。", house);
      addPlan(plans, "au光", "auスマホとの組み合わせを検討できる候補です。", house);
    }
    else if(currentLine === "ニフティ光"){
      addPlan(plans, "au光", "ニフティ光利用中の乗り換え候補です。", house);
      addPlan(plans, "ビッグローブ光", "auスマホ利用者に案内しやすい候補です。", house);
      addPlan(plans, "NURO光 2G", "速度も重視したい方向けの候補です。", house);
    }
    else if(currentLine === "ビッグローブ光"){
      addPlan(plans, "ニフティ光 1G", "ビッグローブ光利用中の乗り換え候補です。", house);
      addPlan(plans, "au光", "auスマホとの組み合わせを検討できる候補です。", house);
      addPlan(plans, "NURO光 2G", "速度も重視したい方向けの候補です。", house);
    }
    else{
      addPlan(plans, "ニフティ光 1G", "auスマホ利用者に案内しやすい候補です。", house);
      addPlan(plans, "ビッグローブ光", "auスマホ利用者に案内しやすい候補です。", house);
      addPlan(plans, "au光", "auスマホとの組み合わせを検討できる候補です。", house);
    }
  }else{
    addPlan(plans, "ニフティ光 1G", "マンション向けの料金で案内しやすい候補です。", house);
    addPlan(plans, "ビッグローブ光", "マンション向けの候補です。", house);
    addPlan(plans, "ドコモ光 1G", "建物状況を確認しながら案内できる候補です。", house);
  }
}

function addDocomoNormalPlans(plans, house, currentLine){
  if(currentLine === "ドコモ光 10G"){
    addPlan(plans, "NURO光 2G", "ドコモ光10G利用中の乗り換え候補です。", house);
    addPlan(plans, "NURO光 10G", "現在と同じ10Gクラスで比較できる候補です。", house);
    return;
  }

  if(currentLine === "ドコモ光 1G"){
    addPlan(plans, "ドコモ光 10G", "現在のドコモ光1Gから10Gへの変更候補です。", house);
    addPlan(plans, "NURO光 2G", "別回線の速度重視候補です。", house);
    addPlan(plans, "NURO光 10G", "高速通信を希望する方向けの候補です。", house);
    return;
  }

  addPlan(plans, "ドコモ光 1G", "ドコモスマホ利用者向けの基本候補です。", house);
  addPlan(plans, "ドコモ光 10G", "高速通信を希望する方向けの候補です。", house);
  addPlan(plans, "NURO光 2G", "別回線の速度重視候補です。", house);
}

function addSoftBankNormalPlans(plans, house, currentLine){
  if(currentLine === "ソフトバンク光"){
    addPlan(plans, "NURO光 2G", "ソフトバンク光利用中の乗り換え候補です。", house);
    addPlan(plans, "NURO光 10G", "高速通信を希望する方向けの候補です。", house);
    return;
  }

  if(currentLine === "NURO光"){
    addPlan(plans, "ソフトバンク光 1G", "NURO光利用中の乗り換え候補です。", house);
    addPlan(plans, "ソフトバンク光 10G", "高速通信を希望する方向けの候補です。", house);
    return;
  }

  addPlan(plans, "ソフトバンク光 1G", "SoftBankスマホ利用者向けの基本候補です。", house);
  addPlan(plans, "NURO光 2G", "速度重視の別候補です。", house);
  addPlan(plans, "NURO光 10G", "高速通信を希望する方向けの候補です。", house);
}

function addOtherCarrierPlans(plans, house){
  addPlan(plans, "ニフティ光 1G", "格安スマホ・その他スマホ利用者に案内しやすい候補です。", house);
  addPlan(plans, "ビッグローブ光", "格安スマホ利用者向けの比較候補です。", house);
  addPlan(plans, "NURO光 2G", "速度も重視したい方向けの候補です。", house);
}

function diagnose(){
  const house = document.getElementById("house").value;
  const region = document.getElementById("region").value;
  const carrier = document.getElementById("carrier").value;
  const currentLine = document.getElementById("currentLine").value;
  const fee = document.getElementById("fee").value;
  const usage = document.getElementById("usage").value;
  const problem = document.getElementById("problem").value;
  const zipcode = document.getElementById("zipcode").value.trim();

  const highSpeedUsage =
    usage === "オンラインゲーム" ||
    usage === "高画質動画・大容量通信";

  const speedMode =
    problem === "速度" ||
    highSpeedUsage;

  let plans = [];
  let ruleTitle = "";
  let caution = "";

  if(speedMode){
    ruleTitle = "速度重視・10Gおすすめ";
    addSpeedPlans(plans, carrier, currentLine, house);

    caution =
      "10G回線は戸建て・マンションとも住所や建物設備により提供可否が異なります。LINEで正確なエリア確認を行います。";
  }
  else{
    if(carrier === "au"){
      ruleTitle = "auスマホ利用中の方向け";
      addAuNormalPlans(plans, house, currentLine);
    }
    else if(carrier === "docomo"){
      ruleTitle = "ドコモスマホ利用中の方向け";
      addDocomoNormalPlans(plans, house, currentLine);
    }
    else if(carrier === "SoftBank"){
      ruleTitle = "SoftBankスマホ利用中の方向け";
      addSoftBankNormalPlans(plans, house, currentLine);
    }
    else{
      ruleTitle = "楽天モバイル・格安スマホ・その他の方向け";
      addOtherCarrierPlans(plans, house);
    }

    if(house === "マンション" && plans.some(plan => plan.name.includes("NURO") || plan.name.includes("au光"))){
      caution =
        "マンションではNURO光・au光が建物設備により利用できない場合があります。LINEで住所確認後、提供可能な回線をご案内します。";
    }
  }

  const topPlans = plans.slice(0,3);

  let html = `
    <h2>診断結果</h2>
    <p class="note">${ruleTitle}</p>
  `;

  if(caution){
    html += `<div class="warning">${caution}</div>`;
  }

  html += `
    <p class="small">
      郵便番号：${zipcode || "未入力"} /
      住居タイプ：${house} /
      地域：${region} /
      現在回線：${currentLine} /
      現在料金：${fee}
    </p>
  `;

  topPlans.forEach((plan, index) => {
    const rank =
      index === 0 ? "🥇 第1位" :
      index === 1 ? "🥈 第2位" :
      "🥉 第3位";

    html += `
      <section class="card">
        <h3 class="rank">${rank}</h3>
        <h2 class="plan-name">${plan.name}</h2>

        ${plan.image ? `
          <img
            class="card-image"
            src="${plan.image}"
            alt="${plan.name}の案内画像"
          >
        ` : ""}

        <a
          class="line-link"
          href="${LINE_URL}"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="${plan.name}についてLINEで無料相談"
        >
          <button class="line-button" type="button">
            LINEで無料相談
          </button>
        </a>

        <p class="price">${plan.price}</p>
        <p class="reason">${plan.reason}</p>
      </section>
    `;
  });

  html += `
    <p class="note">
      ※表示料金は税込の月額料金です。キャンペーン、契約内容、地域、建物設備などにより異なる場合があります。
    </p>
  `;

  const result = document.getElementById("result");
  result.innerHTML = html;
  result.style.display = "block";
  result.scrollIntoView({behavior:"smooth", block:"start"});
}
</script>

</body>
</html>
